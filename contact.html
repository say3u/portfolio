<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — David Nguyen</title>
  <meta name="description" content="Get in touch with David Nguyen — open to internships and collabs." />
  <meta property="og:title" content="Contact — David Nguyen" />
  <meta property="og:description" content="Open to internships and collabs. Reach out to David Nguyen." />
  <meta property="og:url" content="https://daviddnguyen.com/contact.html" />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <section id="contact" class="section">
    <div class="container container--narrow">
      <a href="index.html" class="back-page">&#8592;</a>
      <h2 class="section-heading">Contact</h2>
      <p class="section-sub">
        Open to internships and collabs. I respond within a day.
      </p>
      <div class="contact-links">
        <a href="mailto:daviddnguyen06@gmail.com" class="pill-link">daviddnguyen06@gmail.com</a>
        <a href="index.html" class="pill-link">GitHub &#8599;</a>
        <a href="https://www.linkedin.com/in/daviddnguyen06/" target="_blank" rel="noopener noreferrer" class="pill-link">LinkedIn &#8599;</a>
      </div>

      <form class="contact-form" action="https://formspree.io/f/xykvjqvg" method="POST">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="your@email.com" required />
        </div>
        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" placeholder="What's this about?" required />
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="Say something..." required></textarea>
        </div>
        <button type="submit" class="form-submit">Send &#8599;</button>
      </form>
    </div>
  </section>

  <footer>
    <div class="container footer-inner">
      <span>David Nguyen · 2026</span>
      <a href="index.html" class="back-top">Back to top &uarr;</a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
